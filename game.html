<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>EPIC WARS — The Black Hyena</title>
    <link rel="icon" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
            overflow: hidden;
        }

        #gameTitle {
            font-size: 1.2em;
            color: #800000;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(128,0,0,0.8);
        }

        #gameSubtitle {
            font-size: 0.6em;
            color: #444;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        #gameCanvas {
            border: 2px solid #800000;
            box-shadow: 0 0 30px rgba(128,0,0,0.5);
            image-rendering: pixelated;
        }

        #gameHUD {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-top: 10px;
            font-size: 0.75em;
            letter-spacing: 2px;
        }

        .hud-item {
            color: #800000;
        }

        .hud-value {
            color: white;
        }

        #gameMessage {
            margin-top: 15px;
            font-size: 0.7em;
            color: #555;
            letter-spacing: 2px;
            text-align: center;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .start-title {
            font-size: 2em;
            color: #800000;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(128,0,0,0.9);
            margin-bottom: 10px;
        }

        .start-sub {
            font-size: 0.7em;
            color: #666;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .start-btn {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #800000;
            color: #800000;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

            .start-btn:hover {
                background: #800000;
                color: white;
                box-shadow: 0 0 25px rgba(128,0,0,0.6);
            }

        .controls-info {
            margin-top: 30px;
            font-size: 0.6em;
            color: #444;
            letter-spacing: 2px;
            text-align: center;
            line-height: 2;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .gameover-title {
            font-size: 2.5em;
            color: #800000;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(128,0,0,0.9);
            margin-bottom: 10px;
        }

        .gameover-score {
            font-size: 0.8em;
            color: #666;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        #levelClearScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .levelclear-title {
            font-size: 2em;
            color: #00ff88;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(0,255,136,0.9);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="gameTitle">⚔️ EPIC WARS</div>
    <div id="gameSubtitle">THE BLACK HYENA — DUNGEON MAZE</div>

    <div style="position:relative;">
        <canvas id="gameCanvas" width="600" height="500"></canvas>

        <!-- START SCREEN -->
        <div id="startScreen">
            <div class="start-title">THE BLACK HYENA</div>
            <div class="start-sub">DUNGEON MAZE</div>
            <button class="start-btn" onclick="startGame()">▶ START MISSION</button>
            <div class="controls-info">
                WASD / ARROW KEYS — MOVE<br>
                SPACE — ATTACK<br>
                FIND THE EXIT — DEFEAT ALL ENEMIES
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen">
            <div class="gameover-title">MISSION FAILED</div>
            <div class="gameover-score" id="gameOverScore">SCORE: 0</div>
            <button class="start-btn" onclick="restartGame()">↺ TRY AGAIN</button>
        </div>

        <!-- LEVEL CLEAR SCREEN -->
        <div id="levelClearScreen">
            <div class="levelclear-title">LEVEL CLEAR</div>
            <div class="gameover-score" id="levelClearScore">SCORE: 0</div>
            <button class="start-btn" onclick="nextLevel()">▶ NEXT LEVEL</button>
        </div>
    </div>

    <div id="gameHUD">
        <span><span class="hud-item">HP: </span><span class="hud-value" id="hudHP">100</span></span>
        <span><span class="hud-item">SCORE: </span><span class="hud-value" id="hudScore">0</span></span>
        <span><span class="hud-item">LEVEL: </span><span class="hud-value" id="hudLevel">1</span></span>
        <span><span class="hud-item">ENEMIES: </span><span class="hud-value" id="hudEnemies">0</span></span>
    </div>

    <div id="gameMessage">FIND THE EXIT ⬛ | DEFEAT ENEMIES ⚔️</div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE = 40;
const COLS = 15;
const ROWS = 12;

// COLORS
const COLORS = {
    wall: '#1a0000',
    wallBorder: '#800000',
    floor: '#0d0d0d',
    player: '#cc0000',
    playerSuit: '#1a1a1a',
    enemy: '#aa00ff',
    enemyEye: '#ff00ff',
    exit: '#00ff88',
    attack: 'rgba(128,0,0,0.6)',
    hp: '#800000',
    enemyHp: '#aa00ff',
};

// GAME STATE
let gameState = 'start';
let level = 1;
let score = 0;

// PLAYER
let player = {};
let keys = {};
let attackTimer = 0;
let attackCooldown = 0;
let invincibleTimer = 0;

// ENEMIES
let enemies = [];

// MAP
let map = [];
let exitPos = {};

// CAMERA
let camX = 0, camY = 0;

// INPUT
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function initPlayer() {
    player = {
        x: 1, y: 1,
        px: 1 * TILE, py: 1 * TILE,
        hp: 100, maxHp: 100,
        speed: 3,
        facing: 1,
        attacking: false,
        attackFrame: 0,
    };
}

function generateMap(lvl) {
    map = [];
    for (let r = 0; r < ROWS; r++) {
        map[r] = [];
        for (let c = 0; c < COLS; c++) {
            map[r][c] = 1; // wall
        }
    }

    // Simple maze carving
    function carve(r, c) {
        const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random()-0.5);
        for (let [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr > 0 && nr < ROWS-1 && nc > 0 && nc < COLS-1 && map[nr][nc] === 1) {
                map[r+dr/2][c+dc/2] = 0;
                map[nr][nc] = 0;
                carve(nr, nc);
            }
        }
    }

    map[1][1] = 0;
    carve(1, 1);

    // Exit
    exitPos = { x: COLS-2, y: ROWS-2 };
    map[ROWS-2][COLS-2] = 0;

    // Enemies
    enemies = [];
    let enemyCount = 3 + lvl * 2;
    let placed = 0;
    let attempts = 0;
    while (placed < enemyCount && attempts < 500) {
        attempts++;
        let ex = Math.floor(Math.random() * (COLS-2)) + 1;
        let ey = Math.floor(Math.random() * (ROWS-2)) + 1;
        if (map[ey][ex] === 0 && !(ex === 1 && ey === 1) && !(ex === exitPos.x && ey === exitPos.y)) {
            enemies.push({
                x: ex, y: ey,
                px: ex * TILE, py: ey * TILE,
                hp: 30 + lvl * 10,
                maxHp: 30 + lvl * 10,
                speed: 0.8 + lvl * 0.2,
                moveTimer: 0,
                facing: 1,
                stunTimer: 0,
            });
            placed++;
        }
    }
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    level = 1;
    score = 0;
    initPlayer();
    generateMap(level);
    gameState = 'playing';
    requestAnimationFrame(gameLoop);
}

function restartGame() {
    document.getElementById('gameOverScreen').style.display = 'none';
    level = 1;
    score = 0;
    initPlayer();
    generateMap(level);
    gameState = 'playing';
}

function nextLevel() {
    document.getElementById('levelClearScreen').style.display = 'none';
    level++;
    initPlayer();
    generateMap(level);
    gameState = 'playing';
}

function gameLoop() {
    if (gameState !== 'playing') return;
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function update() {
    // ATTACK
    if (attackCooldown > 0) attackCooldown--;
    if (attackTimer > 0) {
        attackTimer--;
        player.attacking = true;
    } else {
        player.attacking = false;
    }

    if (keys[' '] && attackCooldown === 0) {
        attackTimer = 15;
        attackCooldown = 30;
        // Hit enemies
        enemies.forEach(e => {
            let dist = Math.hypot(e.px - player.px, e.py - player.py);
            if (dist < TILE * 1.5) {
                e.hp -= 25;
                e.stunTimer = 20;
                score += 10;
            }
        });
        enemies = enemies.filter(e => {
            if (e.hp <= 0) { score += 50; return false; }
            return true;
        });
    }

    // MOVEMENT
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -player.speed; player.facing = -1; }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = player.speed; player.facing = 1; }
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = player.speed;

    // Collision
    let nx = player.px + dx;
    let ny = player.py + dy;
    let tileX = Math.floor((nx + TILE/2) / TILE);
    let tileY = Math.floor(player.py / TILE);
    if (tileX >= 0 && tileX < COLS && tileY >= 0 && tileY < ROWS && map[tileY][tileX] === 0) {
        player.px = nx;
    }
    tileX = Math.floor(player.px / TILE);
    tileY = Math.floor((ny + TILE/2) / TILE);
    if (tileX >= 0 && tileX < COLS && tileY >= 0 && tileY < ROWS && map[tileY][tileX] === 0) {
        player.py = ny;
    }

    player.x = Math.floor(player.px / TILE);
    player.y = Math.floor(player.py / TILE);

    // CAMERA
    camX = player.px - canvas.width/2 + TILE/2;
    camY = player.py - canvas.height/2 + TILE/2;
    camX = Math.max(0, Math.min(camX, COLS*TILE - canvas.width));
    camY = Math.max(0, Math.min(camY, ROWS*TILE - canvas.height));

    // ENEMIES UPDATE
    enemies.forEach(e => {
        if (e.stunTimer > 0) { e.stunTimer--; return; }
        e.moveTimer++;
        if (e.moveTimer > 30) {
            e.moveTimer = 0;
            let edx = player.px > e.px ? e.speed : player.px < e.px ? -e.speed : 0;
            let edy = player.py > e.py ? e.speed : player.py < e.py ? -e.speed : 0;
            if (edx !== 0) e.facing = edx > 0 ? 1 : -1;

            let etx = Math.floor((e.px + edx + TILE/2) / TILE);
            let ety = Math.floor(e.py / TILE);
            if (etx >= 0 && etx < COLS && ety >= 0 && ety < ROWS && map[ety][etx] === 0) e.px += edx;

            etx = Math.floor(e.px / TILE);
            ety = Math.floor((e.py + edy + TILE/2) / TILE);
            if (etx >= 0 && etx < COLS && ety >= 0 && ety < ROWS && map[ety][etx] === 0) e.py += edy;
        }

        // Enemy hits player
        if (invincibleTimer <= 0) {
            let dist = Math.hypot(e.px - player.px, e.py - player.py);
            if (dist < TILE * 0.8) {
                player.hp -= 1;
                invincibleTimer = 30;
            }
        }
    });

    if (invincibleTimer > 0) invincibleTimer--;

    // CHECK EXIT
    let distExit = Math.hypot(player.px - exitPos.x*TILE, player.py - exitPos.y*TILE);
    if (distExit < TILE && enemies.length === 0) {
        gameState = 'levelclear';
        document.getElementById('levelClearScreen').style.display = 'flex';
        document.getElementById('levelClearScore').textContent = 'SCORE: ' + score;
    }

    // CHECK DEATH
    if (player.hp <= 0) {
        gameState = 'gameover';
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('gameOverScore').textContent = 'SCORE: ' + score;
    }

    // HUD
    document.getElementById('hudHP').textContent = Math.max(0, player.hp);
    document.getElementById('hudScore').textContent = score;
    document.getElementById('hudLevel').textContent = level;
    document.getElementById('hudEnemies').textContent = enemies.length;
    document.getElementById('gameMessage').textContent =
        enemies.length > 0 ? `DEFEAT ALL ENEMIES ⚔️ (${enemies.length} remaining)` : 'FIND THE EXIT ⬛';
}

function render() {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camX, -camY);

    // DRAW MAP
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let x = c * TILE, y = r * TILE;
            if (map[r][c] === 1) {
                ctx.fillStyle = COLORS.wall;
                ctx.fillRect(x, y, TILE, TILE);
                ctx.strokeStyle = COLORS.wallBorder;
                ctx.lineWidth = 1;
                ctx.strokeRect(x+1, y+1, TILE-2, TILE-2);
            } else {
                ctx.fillStyle = COLORS.floor;
                ctx.fillRect(x, y, TILE, TILE);
                // Floor pattern
                ctx.fillStyle = 'rgba(128,0,0,0.03)';
                ctx.fillRect(x, y, TILE/2, TILE/2);
                ctx.fillRect(x+TILE/2, y+TILE/2, TILE/2, TILE/2);
            }
        }
    }

    // EXIT
    let ex = exitPos.x * TILE, ey = exitPos.y * TILE;
    if (enemies.length === 0) {
        ctx.fillStyle = COLORS.exit;
        ctx.shadowBlur = 20;
        ctx.shadowColor = COLORS.exit;
        ctx.fillRect(ex+5, ey+5, TILE-10, TILE-10);
        ctx.shadowBlur = 0;
        // Arrow
        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('▲', ex+TILE/2, ey+TILE/2+7);
    } else {
        ctx.fillStyle = '#333';
        ctx.fillRect(ex+5, ey+5, TILE-10, TILE-10);
        ctx.fillStyle = '#555';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('🔒', ex+TILE/2, ey+TILE/2+5);
    }

    // ENEMIES
    enemies.forEach(e => {
        let ex = e.px, ey = e.py;

        // Enemy HP bar
        let hpRatio = e.hp / e.maxHp;
        ctx.fillStyle = '#333';
        ctx.fillRect(ex+2, ey-8, TILE-4, 4);
        ctx.fillStyle = COLORS.enemyHp;
        ctx.fillRect(ex+2, ey-8, (TILE-4)*hpRatio, 4);

        // Enemy body (pixel style)
        ctx.save();
        ctx.translate(ex + TILE/2, ey + TILE/2);
        if (e.facing === -1) ctx.scale(-1, 1);

        // Body
        ctx.fillStyle = e.stunTimer > 0 ? '#ff00ff' : '#6600aa';
        ctx.fillRect(-10, -12, 20, 24);

        // Eyes
        ctx.fillStyle = COLORS.enemyEye;
        ctx.fillRect(2, -8, 6, 6);

        // Arms
        ctx.fillStyle = '#4400aa';
        ctx.fillRect(-14, -8, 6, 14);
        ctx.fillRect(8, -8, 6, 14);

        // Legs
        ctx.fillStyle = '#330088';
        ctx.fillRect(-8, 12, 6, 8);
        ctx.fillRect(2, 12, 6, 8);

        ctx.restore();
    });

    // PLAYER
    let px = player.px, py = player.py;

    // Player HP bar
    let hpRatio = player.hp / player.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(px+2, py-10, TILE-4, 5);
    ctx.fillStyle = COLORS.hp;
    ctx.fillRect(px+2, py-10, (TILE-4)*hpRatio, 5);

    // Attack effect
    if (player.attacking) {
        ctx.fillStyle = COLORS.attack;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#800000';
        let ax = player.facing === 1 ? px + TILE/2 : px - TILE/2;
        ctx.beginPath();
        ctx.arc(ax, py + TILE/2, TILE*0.8, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw player (pixel style)
    ctx.save();
    ctx.translate(px + TILE/2, py + TILE/2);
    if (player.facing === -1) ctx.scale(-1, 1);

    // Suit body
    ctx.fillStyle = invincibleTimer > 0 ? '#ff6666' : COLORS.playerSuit;
    ctx.fillRect(-10, -14, 20, 28);

    // Red chest mark
    ctx.fillStyle = '#800000';
    ctx.fillRect(-5, -5, 10, 10);

    // Visor
    ctx.fillStyle = '#800000';
    ctx.fillRect(-8, -12, 16, 7);
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(-5, -11, 10, 5);

    // Arms
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-16, -10, 7, 16);
    ctx.fillRect(9, -10, 7, 16);

    // Legs
    ctx.fillStyle = '#111';
    ctx.fillRect(-8, 14, 6, 9);
    ctx.fillRect(2, 14, 6, 9);

    // Weapon (axe) when attacking
    if (player.attacking) {
        ctx.fillStyle = '#800000';
        ctx.fillRect(9, -15, 4, 20);
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(9, -15, 12, 8);
    }

    ctx.restore();

    ctx.restore();
}

// TOUCH CONTROLS
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    let dx = e.touches[0].clientX - touchStartX;
    let dy = e.touches[0].clientY - touchStartY;
    keys['ArrowLeft'] = dx < -20;
    keys['ArrowRight'] = dx > 20;
    keys['ArrowUp'] = dy < -20;
    keys['ArrowDown'] = dy > 20;
});
canvas.addEventListener('touchend', () => {
    keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = false;
    keys[' '] = true;
    setTimeout(() => { keys[' '] = false; }, 100);
});
    </script>

</body>
</html>
