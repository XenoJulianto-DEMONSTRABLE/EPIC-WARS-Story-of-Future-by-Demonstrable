    <style>
        /* NAVBAR */
        .char-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(56, 30, 255, 0.3);
            box-shadow: 0 0 20px rgba(56, 30, 255, 0.1);
        }

        .nav-icon-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(56, 30, 255, 0.4);
            border-radius: 12px;
            background: rgba(56, 30, 255, 0.05);
            transition: 0.3s;
            text-decoration: none;
            animation: navBoxPulse 3s ease-in-out infinite alternate;
        }

            .nav-icon-box:hover {
                border-color: #381eff;
                background: rgba(56, 30, 255, 0.15);
                box-shadow: 0 0 20px rgba(56, 30, 255, 0.5);
                transform: scale(1.1);
            }

        @keyframes navBoxPulse {
            0% {
                box-shadow: 0 0 5px rgba(56, 30, 255, 0.2);
            }

            100% {
                box-shadow: 0 0 15px rgba(56, 30, 255, 0.4);
            }
        }

        .nav-icon-box img {
            width: 60px;
            height: 60px;
            border: none !important;
            animation: none !important;
            box-shadow: none !important;
        }

        /* TITLE */
        .title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            color: white;
            letter-spacing: 6px;
            margin: 40px 0 30px 0;
            text-shadow: 0 0 20px rgba(56, 30, 255, 0.5);
        }

        /* CHARACTERS GRID - MLBB Style */
        .characters-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            padding: 0 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CHARACTER CARD */
        .char-card-link {
            text-decoration: none;
            display: block;
        }

        .character-card-new {
            position: relative;
            width: 200px;
            height: 280px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

            .character-card-new:hover {
                width: 280px;
                height: 380px;
                z-index: 10;
                border-color: rgba(255,255,255,0.4);
                box-shadow: 0 0 30px rgba(56, 30, 255, 0.6);
            }

            /* IMAGE fills entire card */
            .character-card-new img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: top;
                border: none !important;
                animation: none !important;
                box-shadow: none !important;
                transition: 0.4s;
            }

        /* OVERLAY at bottom */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 15px 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            transition: 0.3s;
        }

        .card-name {
            font-family: 'Orbitron', sans-serif;
            color: white;
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            color: #aaa;
            font-size: 0.65em;
            letter-spacing: 1px;
        }

        /* Sovarion — green glow */
        .sovarion-new:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            border-color: #00ff88;
        }

        .sovarion-new .card-name {
            color: #00ff88;
        }

        /* Vorrath — purple glow */
        .vorrath-new:hover {
            box-shadow: 0 0 30px rgba(170, 0, 255, 0.6);
            border-color: #aa00ff;
        }

        .vorrath-new .card-name {
            color: #aa00ff;
        }
    </style>

</head>
